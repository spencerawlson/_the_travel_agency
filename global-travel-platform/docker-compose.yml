# Full local stack: Nginx -> (Next.js web, FastAPI api) -> PostgreSQL + Redis.
#   cp .env.example .env && docker compose up --build -d
#   open http://localhost:${HTTP_PORT:-8080}
# IMAGE_TAG (default "local") must differ per stack on one host, e.g. a preview, so
# builds never retag another stack's images.
# Only Nginx publishes a port; databases are reachable only on the internal network.
name: gtp

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gtp}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-gtp}
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  ENABLE_DOCS: ${ENABLE_DOCS:-true}
  # mock = demo fares; travelpayouts = real cached Aviasales fares (needs token + marker).
  ENABLED_PROVIDERS: ${ENABLED_PROVIDERS:-mock}
  TRAVELPAYOUTS_API_TOKEN: ${TRAVELPAYOUTS_API_TOKEN:-}
  TRAVELPAYOUTS_MARKER: ${TRAVELPAYOUTS_MARKER:-789134}
  TRAVELPAYOUTS_MARKET: ${TRAVELPAYOUTS_MARKET:-}
  # Partner booking links. Keep false until partner agreement + licensing are confirmed.
  REFERRALS_LIVE_ENABLED: ${REFERRALS_LIVE_ENABLED:-false}
  # true = admins must turn on two-step sign-in before using the dashboard.
  ADMIN_REQUIRE_2FA: ${ADMIN_REQUIRE_2FA:-false}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gtp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: apply migrations, seed reference data, create dev admin (dev only).
  migrate:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    image: gtp-api:${IMAGE_TAG:-local}
    environment:
      <<: *api-env
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
    command: >
      sh -c "alembic upgrade head &&
             python -m app.cli seed &&
             (python -m app.cli ensure-dev-admin || true)"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: gtp-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *api-env
      # Only reachable from inside the compose network (no published port).
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile }
    image: gtp-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      SITE_NAME: ${SITE_NAME:-Farelune}
      LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      PRIVACY_EMAIL: ${PRIVACY_EMAIL:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      # Optional partner script (off when empty); loaded only after visitor consent.
      TRAVELPAYOUTS_SCRIPT_ID: ${TRAVELPAYOUTS_SCRIPT_ID:-}
      # Optional Meta (Facebook) Pixel id (public identifier); consent-gated like the partner script.
      META_PIXEL_ID: ${META_PIXEL_ID:-1126443800341261}
      # Partner id; with SCRIPT_ID it enables the Klook / Kiwi.com widgets.
      TRAVELPAYOUTS_MARKER: ${TRAVELPAYOUTS_MARKER:-789134}
      REFERRALS_LIVE_ENABLED: ${REFERRALS_LIVE_ENABLED:-false}
      TRAVELPAYOUTS_SCRIPT_HOST: ${TRAVELPAYOUTS_SCRIPT_HOST:-}
    depends_on:
      api: { condition: service_healthy }

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      # ",z" relabels the file for SELinux hosts (Fedora/RHEL); ignored elsewhere.
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
