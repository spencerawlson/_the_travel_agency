<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Farelune</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; /* fallback for old WebViews, which this page also serves */
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #fff7f1 0%, #ffe8d9 100%);
      color: #23272f; padding: 24px; text-align: center;
    }
    .card { max-width: 340px; }
    .mark {
      width: 96px; height: 96px; margin: 0 auto 20px;
      border-radius: 28px; overflow: hidden;
      box-shadow: 0 12px 32px rgba(226, 85, 58, .35);
    }
    .mark svg { display: block; width: 100%; height: 100%; }
    h1 { font-size: 26px; letter-spacing: -0.02em; margin-bottom: 8px; }
    p { font-size: 15px; line-height: 1.55; color: #5a6270; margin-bottom: 20px; }
    button {
      font-size: 16px; font-weight: 600; color: #fff; border: 0; cursor: pointer;
      padding: 13px 28px; border-radius: 999px;
      background: linear-gradient(135deg, #f58a5c, #e2553a);
      box-shadow: 0 8px 20px rgba(226, 85, 58, .35);
      min-height: 48px;
    }
    button:active { transform: scale(.97); }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f58a5c"/>
            <stop offset="1" stop-color="#e2553a"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="30" fill="url(#g)"/>
        <g transform="translate(12 12) scale(1.6667) rotate(45 12 12)">
          <path fill="#fff" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
        </g>
      </svg>
    </div>
    <h1>Farelune</h1>
    <p>We couldn&rsquo;t reach farelune.com. Check your connection and try again.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    // Shown in place of the site, so the splash would otherwise wait out its timeout.
    try { window.Capacitor.Plugins.SplashScreen.hide(); } catch (e) {}
    var retry = document.getElementById('retry');
    // Capacitor also lands here when the system WebView is older than
    // android.minWebViewVersion (capacitor.config.ts): the site's CSS needs
    // Chrome 111+ and renders unstyled below it. Ask for an update instead.
    var chrome = /Chrome\/(\d+)/.exec(navigator.userAgent);
    if (chrome && Number(chrome[1]) < 111) {
      var fr = /^fr\b/i.test(navigator.language);
      document.querySelector('p').textContent = fr
        ? 'Farelune a besoin d’une version plus récente d’Android System WebView. Mettez-la à jour dans le Play Store, puis rouvrez l’application.'
        : 'Farelune needs a newer version of Android System WebView. Update it in the Play Store, then reopen the app.';
      retry.textContent = fr ? 'Mettre à jour' : 'Update WebView';
      retry.addEventListener('click', function () {
        window.location.href = 'market://details?id=com.google.android.webview';
      });
    } else {
      retry.addEventListener('click', function () {
        window.location.href = 'https://farelune.com/';
      });
    }
  </script>
</body>
</html>
