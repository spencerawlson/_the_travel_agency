name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests on PostgreSQL, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gtp
          POSTGRES_PASSWORD: gtp
          POSTGRES_DB: gtp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gtp" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://gtp:gtp@localhost:5432/gtp_test
      MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://gtp:gtp@localhost:5432/gtp_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Create empty migration-test database
        run: PGPASSWORD=gtp psql -h localhost -U gtp -d gtp_test -c "CREATE DATABASE gtp_migrations"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q
      - name: Tests also pass on SQLite
        run: env -u TEST_DATABASE_URL -u MIGRATION_TEST_DATABASE_URL pytest -q
      - name: Dependency vulnerability scan
        run: pip-audit --skip-editable

  web:
    name: Web (lint, types, unit tests, build, audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - name: Production dependency audit
        # Dev-only lint tooling has an unpatched advisory (see docs/SECURITY.md).
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Docker Compose + Playwright)
    runs-on: ubuntu-24.04
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure CI environment
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^DEV_ADMIN_PASSWORD=.*|DEV_ADMIN_PASSWORD=ci-admin-Passw0rd-long|" .env
      - run: docker compose up --build -d --wait --wait-timeout 300
      - run: docker compose ps
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_EMAIL: admin@example.com
          E2E_ADMIN_PASSWORD: ci-admin-Passw0rd-long
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
