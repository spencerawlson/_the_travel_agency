# Public access through a Cloudflare Tunnel: no inbound ports or router changes.
# cloudflared opens an outbound connection to Cloudflare; Cloudflare serves HTTPS to
# visitors and forwards requests through the tunnel to Nginx.
#
#   docker compose -f docker-compose.yml -f infrastructure/deployment/docker-compose.tunnel.yml \
#     up -d --build --wait
#
# Requires CLOUDFLARE_TUNNEL_TOKEN in .env (Cloudflare Zero Trust -> Networks -> Tunnels).
# In the Cloudflare dashboard, set the tunnel's public hostname service to http://nginx:80.
# Paths are relative to the main docker-compose.yml (the project directory).
# Switching an existing stack to this file changes the network subnet, so run
# `docker compose down` once first (the database volume is kept).

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.10.0/24

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    networks:
      default:
        # Fixed address: Nginx trusts CF-Connecting-IP only from here.
        ipv4_address: 172.30.10.250
    depends_on:
      nginx: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  nginx:
    volumes:
      - ./infrastructure/nginx/realip-cloudflared.conf:/etc/nginx/realip.d/cloudflared.conf:ro,z
