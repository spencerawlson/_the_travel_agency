# Reverse proxy: same-origin routing of /api -> FastAPI and everything else -> Next.js.
# TLS terminates at Cloudflare and/or this proxy in production; see
# infrastructure/nginx/production-tls.conf.example and docs/DEPLOYMENT.md.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30s;

  log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                              '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
                              '"rt":$request_time,"req_id":"$request_id"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # Behind Cloudflare in production, restore the visitor IP (uncomment and keep
  # the ranges current: https://www.cloudflare.com/ips/).
  # set_real_ip_from 173.245.48.0/20;  ...
  # real_ip_header CF-Connecting-IP;

  # Coarse edge rate limit (defence in depth; the API enforces finer limits).
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  upstream web { server web:3000; keepalive 16; }
  upstream api { server api:8000; keepalive 16; }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # Metrics are for internal scraping only.
    location = /api/v1/metrics { deny all; }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      limit_req_status 429;
      client_max_body_size 64k;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 30s;
    }

    location /_next/static/ {
      proxy_pass http://web;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      client_max_body_size 16k;
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
