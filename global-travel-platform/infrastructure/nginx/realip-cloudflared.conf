# Cloudflare Tunnel: visitors reach Nginx through the cloudflared container, which
# forwards the visitor's address in CF-Connecting-IP. Trust that header ONLY from
# cloudflared's fixed address (see docker-compose.tunnel.yml), so LAN clients that
# connect directly cannot spoof their IP for rate limiting or logs.
set_real_ip_from 172.30.10.250;
real_ip_header CF-Connecting-IP;
