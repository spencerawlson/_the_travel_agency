# Farelune — iOS App Store build + upload workflow

# Place at: .github/workflows/ios-release.yml  (repository ROOT — GitHub only
# runs workflows from the repository root. Do NOT put this under
# global-travel-platform/. The existing .github/workflows/mobile.yml lives
# at the root for the same reason.)
#
# Deliberately workflow_dispatch ONLY at first: this workflow must never
# auto-run (and auto-fail) while the signing secrets are missing. Once a
# manual run has uploaded successfully, a push trigger MAY be added with
# this path filter:
#   push:
#     branches: [main]
#     paths:
#       - global-travel-platform/apps/web/ios/**
#       - global-travel-platform/apps/web/capacitor.config.ts
#       - global-travel-platform/apps/web/capacitor-www/**
#       - global-travel-platform/apps/web/mobile-assets/**
#       - .github/workflows/ios-release.yml
# Do NOT add that trigger until the manual path is proven — an
# auto-triggered signed build on every web commit would burn runs and risk
# uploading builds nobody asked for.
#
# What this workflow does NOT do:
# - It does not touch .github/workflows/mobile.yml (unsigned iOS Simulator
#   build + Android debug APK). That workflow keeps working as-is.
# - It does not change the app, the site, or any secret.
# - It does NOT submit anything for review. Uploading to App Store Connect
#   only lands the build in TestFlight. Submission happens by hand in
#   App Store Connect, after the policy gate in SETUP.md is considered.
#
# Secrets used (names only — no values live in this file):
#   APPLE_CERTIFICATE_P12        base64 of the Apple Distribution .p12
#   APPLE_CERTIFICATE_PASSWORD   password of that .p12
#   APPLE_PROVISIONING_PROFILE   base64 of the App Store .mobileprovision
#                                  for com.farelune.app
#   APPLE_API_KEY_ID             App Store Connect API key ID
#   APPLE_API_ISSUER_ID          App Store Connect API issuer ID
#   APPLE_API_KEY_P8             the .p8 file contents (raw text or base64)

name: iOS App Store build + upload

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  TEAM_ID: RAXA72UKAC
  BUNDLE_ID: com.farelune.app

jobs:
  ios-release:
    name: iOS (App Store .ipa + upload)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: global-travel-platform/package-lock.json

      - name: Install dependencies
        working-directory: global-travel-platform
        run: npm ci

      - name: Sync Capacitor (iOS)
        working-directory: global-travel-platform/apps/web
        run: npx cap sync ios

      - name: Install distribution certificate + provisioning profile
        env:
          CERT_P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          echo "$CERT_P12_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive (Release)
        working-directory: global-travel-platform/apps/web/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Farelune.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive

      - name: Export .ipa
        working-directory: global-travel-platform/apps/web/ios/App
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Farelune.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la build/export/

      - name: Prepare App Store Connect API key
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          # The secret holds the .p8 file. Accept either raw text or base64:
          if printf '%s' "$API_KEY_P8" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_"$API_KEY_ID".p8 2>/dev/null; then
            echo "API key written (base64-decoded)"
          else
            printf '%s' "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_"$API_KEY_ID".p8
            echo "API key written (raw)"
          fi
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_"$API_KEY_ID".p8

      - name: Upload to App Store Connect (TestFlight — NOT a submission)
        working-directory: global-travel-platform/apps/web/ios/App
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls build/export/*.ipa | head -n 1)
          echo "Uploading $IPA"
          xcrun altool --upload-app --type ios -f "$IPA" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Keep the .ipa as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: farelune-ios-release
          path: global-travel-platform/apps/web/ios/App/build/export/*.ipa
          if-no-files-found: error
